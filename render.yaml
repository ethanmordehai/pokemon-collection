services:
  - type: web
    name: pokemon-collection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: POKEWALLET_API_KEY
        sync: false
      - key: CARDMARKET_API_KEY
        sync: false
